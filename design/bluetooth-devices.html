<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Bluetooth devices · 480px interaction prototype</title>
<style>
:root{font:16px system-ui,sans-serif;color:#182d25;background:#edf2ef;--surface:#fff;--soft:#edf2ef;--ink:#182d25;--muted:#526b60;--accent:#205d48;--on:#fff}body{margin:24px;display:grid;justify-content:center;gap:16px}body.dark{background:#171c20;--surface:#080910;--soft:#111b21;--ink:#e5f1f7;--muted:#b6c7d1;--accent:#8bddf8;--on:#102630;color:var(--ink)}aside{max-width:480px;display:flex;flex-wrap:wrap;gap:8px}button,select{font:inherit;border:0;border-radius:12px;padding:12px;background:var(--soft);color:var(--ink);cursor:pointer}button:disabled{opacity:.45;cursor:default}button.active,.primary{background:var(--accent);color:var(--on)}#screen{width:480px;height:480px;box-sizing:border-box;background:var(--surface);color:var(--ink);box-shadow:0 16px 48px #0002;position:relative;border-radius:8px;padding:8px 12px}header{display:flex;align-items:center;justify-content:space-between;height:48px}h1{font-size:22px;font-weight:500;margin:0}h2{font-size:20px;font-weight:500}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.tabs button{height:48px;padding:0}.name{font-size:14px;color:var(--muted);height:24px;margin-top:8px}.status{font-size:14px;min-height:28px}.rows{display:grid;gap:4px;margin-top:8px}.row{height:44px;display:flex;align-items:center;justify-content:space-between;text-align:left;font-size:14px}.row small{color:var(--muted)}.empty{padding-top:48px;color:var(--muted)}footer{position:absolute;bottom:8px;left:12px;right:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}footer button{height:48px;padding:0}.pages{position:absolute;bottom:64px;left:12px;right:12px;display:flex;align-items:center;justify-content:space-between}.detail{font-size:14px;color:var(--muted);line-height:1.5}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:24px 0}.warning{color:var(--muted);font-size:14px}.confirm{margin-top:42px;line-height:1.6}p{margin:8px 0}.caption{font-size:13px;max-width:480px;color:var(--muted)}.draft{padding:16px;background:var(--soft);border-radius:12px;margin-top:24px}
</style>
<aside aria-label="Prototype scenarios"><button data-origin="Mouse">System Bluetooth</button><button data-origin="Audio">Audio · Manage devices</button><button data-origin="Keyboard">Keyboard · settings</button><button id="theme">Light / dark</button><select id="scenario" aria-label="Scenario"><option value="saved">Saved devices · same name</option><option value="empty">No saved devices</option><option value="lost">Disconnected</option><option value="error">Pairing failure</option></select></aside>
<main id="screen" aria-live="polite"></main><p class="caption">Interactive design fixture, 480 × 480. Names, links and pairing events are simulated. No radio, audio or stored pairings are changed. Each purpose has its own records; the keyboard draft and input transport stay intact.</p>
<script>
const screen=document.querySelector('#screen');let purpose=0,mode='Mouse',page='list',selected=null,review=null;
let records=[[],[]],windows=[0,0],failed=[false,false];
const names=['Mosaico','Mosaico Audio'];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function reset(kind){records=[[{id:'C3:00:00:00:00:01/1',name:'Work PC',connected:false}],[{id:'C2:00:00:00:00:02',name:'Work PC',mic:false,speaker:false}]];windows=[0,0];failed=[false,false];if(kind==='empty')records=[[],[]];if(kind==='error')failed=[true,true];page='list';selected=null;render()}
const button=(name,action,disabled=false)=>`<button ${disabled?'disabled':''} data-do="${action}">${name}</button>`;
function render(){let r=selected;let title=page==='home'?mode:page==='options'?'Input device options':page==='detail'?(purpose?'Audio device':'Mouse & Keyboard device'):page==='confirm'?'Confirm action':'Bluetooth devices';let html=`<header><h1>${title}</h1>${button('Close','close')}</header>`;
if(page==='home'){html+=`<div class="draft">${mode==='Keyboard'?'Draft: AB · unsent':mode==='Audio'?'USB / Bluetooth · Mic off · Speaker off':'Touchpad · Motion off'}</div><p>Input transport: USB</p>${button('Manage devices','manage')}`}
else if(page==='options'){html+=`<p class="detail">Resume input reconnect, manage saved input pairings, or edit the input search name.</p><div class="actions">${button('Resume','allow')}${button('Forget all','forget-all')}${button('Device name','name')}</div><footer style="grid-template-columns:1fr">${button('Back to devices','back')}</footer>`}
else if(page==='confirm'){let all=review==='forget-all';html+=`<section class="confirm"><h2>${review==='forget-all'?'Forget all saved input devices?':review==='forget'?'Forget this saved device?':'Allow audio pairing?'}</h2><p>${all?'Input pairings only; audio pairings stay paired.':review==='forget'?esc(r.name)+' · '+esc(r.id):'Allow audio pairing for 120 seconds. Input pairing closes; saved devices stay paired.'}</p><p>${(all||review==='forget')?'Audio pairings are retained; this simulated fixture changes input records only.':'Mic and Speaker stay off until separately started.'}</p></section><footer>${button('Cancel','cancel')}${button(all?'Forget all':review==='forget'?'Forget this device':'Pair audio','accept')}</footer>`}
else if(page==='detail'){html+=`<h2>${esc(r.name)}</h2><p>${esc(r.id)}</p>`;if(purpose){html+=`<p class="detail">Mic: ${r.mic?'Connected':'Disconnected'} / Speaker: ${r.speaker?'Connected':'Disconnected'}</p><div class="actions">${button('Connect mic','mic-on',r.mic)}${button('Disconnect mic','mic-off',!r.mic)}${button('Connect speaker','speaker-on',r.speaker)}${button('Disconnect speaker','speaker-off',!r.speaker)}</div><p class="detail">Connecting does not start audio.</p><p class="warning">Audio Forget is unavailable in this firmware. Disconnect keeps this device paired. Host-side forgetting does not remove the Mosaico record.</p>${button('Forget unavailable','noop',true)}`}else{html+=`<p class="detail">${r.connected?'Connected':'Connect from this host’s Bluetooth settings. Mosaico cannot dial the input host.'}</p><div class="actions">${button('Allow reconnect','allow')}${button('Disconnect','disconnect',!r.connected)}</div>${button('Forget this device','forget')}`}html+=`<footer style="grid-template-columns:1fr">${button('Back to devices','back')}</footer>`}
else{html+=`<div class="tabs">${button('Mouse & Keyboard','input')}${button('Audio','audio')}</div><div class="name">Search name: ${names[purpose]}</div><div class="status">${failed[purpose]?'Pairing failed: authentication timed out. Check host settings.':windows[purpose]?`${purpose?'Discoverable':'Pairing open'} / ${windows[purpose]}s`:'Pairing closed'}</div><div class="rows">${records[purpose].map((r,i)=>`<button class="row" data-row="${i}"><span>${esc(r.name)}<small> · ${esc(r.id)}</small></span><span>${r.connected||r.mic||r.speaker?'Connected':'Saved'}</span></button>`).join('')||'<p class="empty">No saved devices. Choose Add device to pair.</p>'}</div><div class="pages">${button('Previous','noop',true)}<span>1 / 1</span>${button('Next','noop',true)}</div><footer style="grid-template-columns:${purpose?'1fr 1fr':'1fr 1fr 1fr'}">${button('Add device','add')}${button('Stop pairing','stop',!windows[purpose])}${purpose?'':button('More','options')}</footer>`}
screen.innerHTML=html;if(page==='list')screen.querySelectorAll('.tabs button')[purpose].classList.add('active')}
screen.onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.row!==undefined){selected=records[purpose][Number(b.dataset.row)];page='detail';render();return}switch(b.dataset.do){case'input':purpose=0;page='list';break;case'audio':purpose=1;page='list';break;case'close':windows=[0,0];page='home';break;case'manage':purpose=mode==='Audio'?1:0;page='list';break;case'back':page='list';break;case'options':page='options';break;case'forget-all':review='forget-all';page='confirm';break;case'name':{const value=prompt('Input search name',names[0]);if(value&&value.trim())names[0]=value.trim();break;}case'add':failed[purpose]=false;if(purpose){review='pair';page='confirm'}else windows[0]=120;break;case'stop':windows[purpose]=0;break;case'forget':review='forget';page='confirm';break;case'cancel':page=review==='forget-all'?'options':review==='forget'?'detail':'list';break;case'accept':if(review==='forget-all'){records[0]=[];selected=null}else if(review==='forget'){records[0]=records[0].filter(r=>r!==selected);selected=null}else{windows[0]=0;windows[1]=120}page='list';break;case'allow':alert('Reconnect allowed. Open Bluetooth settings on Work PC and select Mosaico. Input is not ready until authenticated.');break;case'disconnect':selected.connected=false;break;case'mic-on':selected.mic=true;break;case'mic-off':selected.mic=false;break;case'speaker-on':selected.speaker=true;break;case'speaker-off':selected.speaker=false;break}render()};
document.querySelectorAll('[data-origin]').forEach(b=>b.onclick=()=>{mode=b.dataset.origin;purpose=mode==='Audio'?1:0;page='list';render()});document.querySelector('#theme').onclick=()=>document.body.classList.toggle('dark');document.querySelector('#scenario').onchange=e=>reset(e.target.value);setInterval(()=>{let changed=false;windows=windows.map(n=>{if(n)changed=true;return Math.max(0,n-1)});if(changed&&page==='list')render()},1000);reset('saved');
</script></html>
